<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body style="margin:0;padding:0;background-color:#F1F8F2;font-family:Arial, Helvetica, sans-serif;">
    <div style="background-color:#F1F8F2;padding:24px 12px;">
        <div style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #DCEEE0;">
            <div style="padding:20px 24px;border-bottom:3px solid #0F7A3D;">
                <img src="https://apps.ppmc.gov.pk/ppmc-doc-signer/assets/images/logo-email.png" alt="{{appName}}" height="44" style="display:block;border:0;" />
            </div>
            <div style="padding:28px 24px;text-align:center;">
                <p style="margin:0 0 8px 0;font-size:14px;color:#14231A;">Hello!</p>
                <p style="margin:0;font-size:14px;color:#14231A;">This is a notice regarding your account: <strong>{{username}}</strong></p>
            </div>
            <div style="background-color:#F1F8F2;padding:14px 24px;border-top:1px solid #DCEEE0;">
                <p style="margin:0;font-size:11px;color:#5A6B60;">{{appName}} &middot; Power Planning &amp; Monitoring Company &middot; Govt. of Pakistan</p>
            </div>
        </div>
    </div>
</body>

</html>
